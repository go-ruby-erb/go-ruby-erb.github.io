baseURL = "https://go-ruby-erb.github.io/"
title = "go-ruby-erb"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Tag scanner & literals"
  status = "ready"
  blurb = "The MRI tag scanner for `<% code %>`, `<%= expression %>` and `<%# comment %>`, plus the `<%%` / `%%>` literal escapes — split into the exact stags/etags the reference `ERB::Compiler` produces."
[[params.phases]]
  name = "Trim modes"
  status = "ready"
  blurb = "Every MRI `trim_mode` and its combinations — `-` explicit `-%>` newline strip, `>` end-of-line strip, `<>` start-and-end strip, and `%` percent-line code (`%%` escaping a literal `%`)."
[[params.phases]]
  name = "Compiler & text encoding"
  status = "ready"
  blurb = "AST → Ruby source via MRI's put/insert/pre/post command wiring, with literal runs emitted through Ruby's `String#dump` on the binary string so quotes, newlines, control bytes and multibyte UTF-8 round-trip byte-for-byte."
[[params.phases]]
  name = "Magic comments & ERB::Util"
  status = "ready"
  blurb = "Leading `<%# coding: … %>` / `frozen_string_literal: …` detection (incl. the emacs `-*- … -*-` form) reflected in the emitted prefix, plus `ERB::Util`'s `HTMLEscape` / `URLEncode` helpers."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "A wide template corpus compiled both here and by the system `ruby`, comparing emitted source **and** rendered output byte-for-byte against MRI; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches."
[[params.phases]]
  name = "Ruby surface"
  status = "planned"
  blurb = "Downstream, not part of this compiler module: the final `eval(compiled_src, binding)` that renders the string needs a Ruby interpreter and lives in the go-embedded-ruby consumer (rbgo). This library compiles; the host evaluates."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
